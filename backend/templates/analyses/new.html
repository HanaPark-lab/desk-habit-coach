{% extends "base.html" %}
{% load static %}
{% block title %}새 분석 · desk habit.{% endblock %}
{% block content %}
<h1>새 분석</h1>
<section class="card narrow" aria-labelledby="input-title">
  <h2 id="input-title">입력 방식</h2>
  <div class="tabs" role="tablist" aria-label="입력 방식">
    <button type="button" role="tab" data-mode="UPLOAD" aria-selected="true" aria-controls="upload-fields">영상 업로드</button>
    <button type="button" role="tab" data-mode="IPCAM" aria-selected="false" aria-controls="ipcam-fields">IP Webcam</button>
  </div>
  <form id="analyze-form" novalidate>
    {% csrf_token %}
    <div id="upload-fields" role="tabpanel">
      <label class="dropzone" id="dropzone">
        <input type="file" name="video_file" accept="video/*" aria-describedby="dz-text">
        <span class="dz-text" id="dz-text">영상 파일을 여기에 끌어다 놓거나 클릭해서 선택하세요 (mp4, 5초 이상)</span>
      </label>
    </div>
    <div id="ipcam-fields" role="tabpanel" hidden>
      <label>카메라 <select name="camera_key"></select></label>
      <label>수집 시간(초) <input type="number" name="capture_seconds" min="5" max="15" step="1"></label>
      <p class="note">시작을 누른 뒤 카메라 앞에서 동작하세요. 수집 시간 동안 영상을 모은 뒤 분석합니다.</p>
    </div>
    <label>제목 <small class="muted">(선택)</small> <input name="job_title" maxlength="150" placeholder="오후 물 마시기"></label>
    <p id="form-error" class="error" role="alert"></p>
    <button type="submit" class="primary">AI 분석 시작</button>
  </form>
</section>
{{ page_config|json_script:"page-config" }}
{% endblock %}
{% block scripts %}<script src="{% static 'js/analyses.js' %}"></script>{% endblock %}
