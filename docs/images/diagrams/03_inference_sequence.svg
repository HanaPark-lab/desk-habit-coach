<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#89928e"/></marker></defs><rect width="1200" height="1120" fill="#fafafa"/><g font-family="NanumGothic, sans-serif" font-size="14" fill="#23332c"><text x="35" y="34" font-size="22">03. AI 분석 버튼 구현 흐름</text><rect x="25" y="105" width="1150" height="236" rx="5" fill="#e2eee4" opacity=".65"/><text x="35" y="121" font-size="12">요청 접수</text><rect x="25" y="341" width="1150" height="236" rx="5" fill="#fff0d8" opacity=".65"/><text x="35" y="357" font-size="12">비동기 처리</text><rect x="25" y="577" width="1150" height="118" rx="5" fill="#e0eaf5" opacity=".65"/><text x="35" y="593" font-size="12">AI 추론</text><rect x="25" y="695" width="1150" height="118" rx="5" fill="#eae3f2" opacity=".65"/><text x="35" y="711" font-size="12">결과 저장</text><rect x="25" y="813" width="1150" height="236" rx="5" fill="#eeeeee" opacity=".65"/><text x="35" y="829" font-size="12">상태 조회 · 2초 간격 반복</text><rect x="25" y="53" width="150" height="38" rx="4" fill="#dce8f8" stroke="#86a8ca"/><text x="100" y="77" text-anchor="middle">Browser</text><path d="M100 91 V1070" stroke="#b2b8b5" stroke-dasharray="5 4"/><rect x="225" y="53" width="150" height="38" rx="4" fill="#dce8f8" stroke="#86a8ca"/><text x="300" y="77" text-anchor="middle">Django / DRF</text><path d="M300 91 V1070" stroke="#b2b8b5" stroke-dasharray="5 4"/><rect x="425" y="53" width="150" height="38" rx="4" fill="#dce8f8" stroke="#86a8ca"/><text x="500" y="77" text-anchor="middle">PostgreSQL</text><path d="M500 91 V1070" stroke="#b2b8b5" stroke-dasharray="5 4"/><rect x="625" y="53" width="150" height="38" rx="4" fill="#dce8f8" stroke="#86a8ca"/><text x="700" y="77" text-anchor="middle">Redis</text><path d="M700 91 V1070" stroke="#b2b8b5" stroke-dasharray="5 4"/><rect x="825" y="53" width="150" height="38" rx="4" fill="#dce8f8" stroke="#86a8ca"/>